spring.application.name=gestor-de-citas

spring.datasource.url=jdbc:mysql://localhost:3306/anggie_website
spring.datasource.username=root
spring.datasource.password=123qwas456

# ================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
